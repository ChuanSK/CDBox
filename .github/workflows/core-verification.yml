name: Core verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Installer build and core tests
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore independent projects
        shell: pwsh
        run: |
          dotnet restore CDBox.ReleaseTool/CDBox.ReleaseTool.csproj
          dotnet restore CDBoxInstaller/CDBoxInstaller.csproj
          dotnet restore tests/CDBox.CoreTests/CDBox.CoreTests.csproj

      - name: Prepare Autodesk API references for module compilation
        shell: pwsh
        run: |
          $cadReferences = ./tests/Restore-AutoCADReferences.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'CDBox.AutoCADReferences')
          "AutoCADManagedDir=$cadReferences" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate Release Manifest V2 pipeline
        shell: pwsh
        run: ./tests/Test-ReleaseManifest.ps1

      - name: Build installer
        run: dotnet build CDBoxInstaller/CDBoxInstaller.csproj -c Release --no-restore

      - name: Run core tests
        run: dotnet run --project tests/CDBox.CoreTests/CDBox.CoreTests.csproj -c Release --no-restore
