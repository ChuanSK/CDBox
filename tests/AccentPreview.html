<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>CDBox 5.1.3 强调色验证</title><style>body{margin:0;background:#eee;color:#222;font:13px 'Segoe UI',sans-serif}header{display:flex;gap:12px;padding:12px;background:white;align-items:center}iframe{width:1280px;height:820px;border:1px solid #aaa;margin:16px}button,select{padding:6px;font:inherit}#result{margin-left:auto}pre{white-space:pre-wrap;padding:18px}</style><header><strong>CDBox 5.1.3 · 强调色</strong><select id="page"><option value="../common/frame-light.html">图框设置</option><option value="../common/excel-light.html">Excel 转 CAD</option><option value="../settings/settings.html">CDBox 设置</option><option value="../parcel/light.html">宗地编辑器</option><option value="building.html">建筑物边长设置</option><option value="quantity.html">工程量工作台</option><option value="section.html">断面生成</option></select><select id="color"><option value="#0169CC">蓝色</option><option value="#BB2255">玫红</option><option value="#FFFF00">亮黄色</option><option value="#FFFFFF">白色</option><option value="#000000">黑色</option></select><button id="check">运行强调色检查</button><span id="result">模拟配置，不修改插件设置</span></header><iframe id="editor" title="插件界面" src="../common/frame-light.html"></iframe><details><summary>验证记录</summary><pre id="report"></pre></details><script>
const f=document.getElementById('editor'),page=document.getElementById('page'),color=document.getElementById('color');
function settings(mode,accent){const profile={Preset:'custom',Background:mode==='dark'?'#181818':'#FFFFFF',Foreground:mode==='dark'?'#DFDFDF':'#1A1C1F',Accent:accent,AccentSource:'custom',Contrast:50,UiFont:'system',ContentFont:'inherit',UiWeight:400,ContentWeight:400};return {Theme:mode,AnimationsEnabled:true,LightTheme:{...profile},DarkTheme:{...profile}}}
function apply(mode='light'){let w=f.contentWindow,s=settings(mode,color.value);if(w.CDBoxApplyWorkbenchTheme)w.CDBoxApplyWorkbenchTheme(s);else w.CDBoxApplyAccentTheme(s,true)}
page.onchange=()=>{f.onload=()=>apply();f.src=page.value};color.onchange=()=>apply();
document.getElementById('check').onclick=async function(){this.disabled=true;let rows=[];const wait=(n=240)=>new Promise(r=>setTimeout(r,n)),check=(yes,msg)=>{rows.push((yes?'PASS ':'FAIL ')+msg);if(!yes)throw Error(msg)},rgb=hex=>'rgb('+[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)).join(', ')+')';try{
for(const url of [...page.options].map(o=>o.value)){f.onload=null;f.src=url+'?test='+Date.now();await new Promise(r=>f.onload=r);await wait();let w=f.contentWindow,d=w.document;check(typeof w.CDBoxApplyAccentTheme==='function',url+' 接入统一强调色');
 for(const mode of ['light','dark'])for(const accent of ['#0169CC','#BB2255','#FFFF00','#FFFFFF','#000000']){let s=settings(mode,accent);if(w.CDBoxApplyWorkbenchTheme)w.CDBoxApplyWorkbenchTheme(s);else w.CDBoxApplyAccentTheme(s,true);await wait();const buttons=[...d.querySelectorAll('button.primary,.primary-btn,button.save,[data-accent-action]')].filter(b=>b.offsetWidth&&!b.matches('.danger'));check(buttons.length>0,url+' 存在可见主要操作');check(buttons.every(b=>w.getComputedStyle(b).backgroundColor===rgb(accent)),url+'/'+mode+'/'+accent+' 操作按钮使用强调色');check(buttons.every(b=>['rgb(0, 0, 0)','rgb(255, 255, 255)'].includes(w.getComputedStyle(b).color)),url+'/'+accent+' 按钮文字自动切换黑白');}
 const danger=d.querySelector('button.danger');if(danger)check(w.getComputedStyle(danger).backgroundColor!==rgb('#000000'),url+' 删除操作保留独立语义');check((w.previewErrors||[]).length===0,url+' 无脚本错误');
}
document.getElementById('result').textContent=rows.length+' 项检查全部通过';
}catch(e){document.getElementById('result').textContent='检查失败：'+e.message;rows.push(e.stack)}finally{document.getElementById('report').textContent=rows.join('\n');this.disabled=false}};
</script></html>
