<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>CDBox · 设置工作台预览</title><style>body{margin:0;background:#ededed;color:#222;font:13px 'Segoe UI','Microsoft YaHei UI',sans-serif}header{height:48px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#fafafa}button,select{font:inherit;padding:5px 10px}#stage{padding:16px;width:max-content}.frame{width:1180px;border:1px solid #aaa;border-radius:8px;overflow:hidden}#chrome{height:34px;background:#f9f9f9;padding:0 14px;display:flex;align-items:center;font-size:12px}iframe{display:block;border:0;width:100%;height:800px}#result{margin-left:auto}details{margin:16px}pre{white-space:pre-wrap}</style><header><strong>CDBox · 设置预览</strong><label>窗口 <select id="size"><option>1180</option><option>900</option><option>1440</option></select></label><button id="check">运行交互检查</button><span id="result">示例设置 · 不修改插件配置</span></header><div id="stage"><div class="frame"><div id="chrome">CDBox 设置</div><iframe id="editor" src="settings.html" title="CDBox 设置"></iframe></div></div><details><summary>验证结果</summary><pre id="report"></pre></details><script>
const frame=document.getElementById('editor'),box=document.querySelector('.frame');document.getElementById('size').onchange=e=>box.style.width=e.target.value+'px';
setInterval(()=>{const b=frame.contentDocument?.body;if(b){document.getElementById('chrome').style.background=frame.contentWindow.getComputedStyle(b).getPropertyValue('--sidebar');document.getElementById('chrome').style.color=frame.contentWindow.getComputedStyle(b).getPropertyValue('--text');}},150);
document.getElementById('check').onclick=async function(){this.disabled=true;const results=[],wait=(ms=80)=>new Promise(r=>setTimeout(r,ms)),check=(yes,text)=>{results.push((yes?'PASS ':'FAIL ')+text);if(!yes)throw Error(text);};document.getElementById('result').textContent='正在验证…';try{
 frame.src='settings.html?test='+Date.now();await new Promise(r=>frame.onload=r);const w=frame.contentWindow,d=frame.contentDocument,$=id=>d.getElementById(id),q=s=>d.querySelector(s),all=s=>[...d.querySelectorAll(s)],style=e=>w.getComputedStyle(e),click=s=>q(s).click(),change=(id,value)=>{$(id).value=value;$(id).dispatchEvent(new w.Event('input',{bubbles:true}));$(id).dispatchEvent(new w.Event('change',{bubbles:true}));};await wait();
 check(all('[data-section]').length===4,'四个设置分类保留原功能');
 for(const width of [1180,900,1440]){box.style.width=width+'px';await wait();for(const mode of ['light','dark']){click('[data-mode="'+mode+'"]');await wait();for(const preset of ['codex','github','solarized','nord','one']){change('themePreset',preset);await wait();check(d.documentElement.scrollWidth<=w.innerWidth&&q('.settings-main').scrollWidth<=q('.settings-main').clientWidth+1,`${width}/${mode}/${preset} 页面无横向溢出`);check(style(d.body).getPropertyValue('--bg').trim().toUpperCase()===$('Background').value.toUpperCase(),`${width}/${mode}/${preset} 主题背景即时应用`);check(['已自动保存','设置已加载'].includes($('saveStatus').textContent),`${width}/${mode}/${preset} 保存已确认`);}for(const name of ['appearance','floating','drawing','updates']){click('[data-section="'+name+'"]');check(!q('[data-panel="'+name+'"]').hidden,`${width}/${mode}/${name} 分类切换正常`);}click('[data-section="appearance"]');}}
 box.style.width='1180px';click('[data-mode="dark"]');change('themePreset','github');await wait();check($('Accent').value==='#1F6FEB'&&$('Background').value==='#0D1117'&&$('Foreground').value==='#E6EDF3','GitHub 深色核心色与参考截图一致');
 change('Background','#112233');change('UiFont','yahei');change('ContentFont','mono');change('UiWeight','600');change('Contrast','75');await wait();check(style(d.body).getPropertyValue('--content-font').includes('Consolas')&&style(d.body).getPropertyValue('--ui-weight')==='600','内容字体与 UI 字重即时应用');
 click('[data-mode="light"]');change('themePreset','codex');await wait();check($('Background').value==='#FFFFFF','浅色主题独立保存');click('[data-mode="dark"]');await wait();check($('Background').value==='#112233'&&$('Contrast').value==='75','切回深色保留定制颜色和对比度');
 const saves=()=>w.previewMessages.filter(x=>x.startsWith('studio|settings|')).length;const before=saves();change('Background','oops');await wait();check($('Background').getAttribute('aria-invalid')==='true'&&saves()===before,'非法 HEX 不污染主题或持久设置');change('Background','#112233');await wait();
 click('#copyTheme');check(JSON.parse(w.previewCopiedTheme).profile.Background==='#112233','复制主题包含当前模式定制项');click('#importTheme');$('themeImportText').value='{"format":"invalid"}';click('#applyImport');check($('themeImportDialog').open&&$('importError').textContent.includes('无效'),'拒绝无效主题 JSON 并保留对话框');$('themeImportText').value=w.previewCopiedTheme;click('#applyImport');await wait();check(!$('themeImportDialog').open&&$('themePreset').value==='custom','导入合法主题并自动保存');
 change('AccentSource','foreground');await wait();check(style(d.body).getPropertyValue('--focus').toUpperCase()===$('Foreground').value.toUpperCase(),'强调色可跟随前景');
 click('[data-section="floating"]');$('floatingCenterEnabled').click();change('floatingCenterAutoCloseSeconds','12');change('hudNormalOpacity','60');await wait();check(w.previewSettingsSaved.floatingCenterEnabled==='0'&&w.previewSettingsSaved.floatingCenterAutoCloseSeconds==='12'&&Math.abs(Number(w.previewSettingsSaved.hudNormalOpacity)-.68)<.001,'悬浮球开关、提示时间和透明度继续正确保存');
 click('[data-section="drawing"]');change('colorOutputMode','PreferTrueColor');$('doubleClickOpen').click();await wait();check(w.previewSettingsSaved.colorOutputMode==='PreferTrueColor'&&w.previewSettingsSaved.doubleClickOpen==='0','CAD 颜色输出和双击设置保留');
 click('[data-section="updates"]');change('releaseChannel','stable');await wait();check(w.previewSettingsSaved.updateChannel==='stable'&&!('releaseServiceUrl' in w.previewSettingsSaved),'更新通道持久保存且不再提交服务地址');check(!d.getElementById('releaseServiceUrl'),'内置服务地址不显示输入框');click('#checkUpdateButton');check(w.previewMessages.some(x=>x.startsWith('studio|checkUpdate|')),'更新检查接入原路由');
 click('[data-section="appearance"]');w.previewFail=true;change('Contrast','65');await wait();check(!$('retrySettings').hidden&&$('saveStatus').textContent==='保存失败','保存失败可见且允许重试');w.previewFail=false;click('#retrySettings');await wait();check($('saveStatus').textContent==='已自动保存','重试保存成功');
 w.previewDelay=180;change('Contrast','30');change('Contrast','80');await wait(430);check(JSON.parse(w.previewSettingsSaved.darkTheme).Contrast===80,'连续变更合并后保存最新值');change('Contrast','50');await wait(230);change('Contrast','80');await wait(230);check(JSON.parse(w.previewSettingsSaved.darkTheme).Contrast===80,'恢复曾保存过的值也能持久化');
 check(w.previewErrors.length===0,'无浏览器脚本异常');document.getElementById('result').textContent=results.length+' 项检查全部通过';
}catch(e){document.getElementById('result').textContent='检查失败：'+e.message;results.push(e.stack);}finally{document.getElementById('report').textContent=results.join('\n');this.disabled=false;}};
</script></html>
