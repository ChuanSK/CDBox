<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>CDBox · 公共业务工作台</title><style>
body{margin:0;background:#e9e9e9;color:#222;font:13px 'Segoe UI','Microsoft YaHei UI',sans-serif}header{display:flex;gap:12px;align-items:center;padding:12px 18px;background:#fafafa}button,select{font:inherit;padding:5px 10px}#result{margin-left:auto}#stage{padding:16px;width:max-content}iframe{display:block;width:1280px;height:850px;border:1px solid #aaa;border-radius:9px;background:white}pre{white-space:pre-wrap;padding:16px}
</style><header><strong>公共业务 · 工作台预览</strong><select id="page"><option value="frame">图框设置</option><option value="excel">Excel 转 CAD</option><option value="short">简码识别</option><option value="home">公共业务入口</option></select><select id="mode"><option value="light">浅色</option><option value="dark">深色 · GitHub</option></select><select id="size"><option>1280</option><option>980</option><option>820</option><option>620</option></select><button id="check">运行交互检查</button><span id="result">示例数据 · 不操作 CAD 或用户配置</span></header><div id="stage"><iframe id="editor" title="公共业务界面" src="frame-light.html"></iframe></div><details><summary>验证记录</summary><pre id="report"></pre></details><script>
const frame=document.getElementById('editor'),page=document.getElementById('page'),mode=document.getElementById('mode'),size=document.getElementById('size');function refresh(){frame.src=page.value+'-'+mode.value+'.html';frame.style.width=size.value+'px'}[page,mode,size].forEach(e=>e.onchange=refresh);
document.getElementById('check').onclick=async function(){this.disabled=true;let results=[];const wait=(ms=60)=>new Promise(r=>setTimeout(r,ms)),check=(ok,label)=>{results.push((ok?'PASS ':'FAIL ')+label);if(!ok)throw Error(label)},load=async(p,m,width)=>{page.value=p;mode.value=m;frame.style.width=width+'px';frame.src=p+'-'+m+'.html?check='+Date.now();await new Promise(r=>frame.onload=r);await wait();return frame.contentWindow};try{
 for(const p of ['home','short','excel','frame'])for(const m of ['light','dark'])for(const width of p==='frame'?[1280,980,620]:p==='excel'?[1060,820,620]:[860,620]){let w=await load(p,m,width),d=w.document;check(d.documentElement.scrollWidth<=w.innerWidth,p+'/'+m+'/'+width+' 无页面横向溢出');check(d.body.dataset.appearance==='workbench'&&d.body.dataset.theme===m,p+'/'+m+'/'+width+' 使用统一主题');check(w.previewErrors.length===0,p+'/'+m+'/'+width+' 无脚本错误');}
 let w=await load('short','light',760),d=w.document,$=id=>d.getElementById(id);$('symbol').value='#';$('previous').click();$('close').click();$('save').click();let msg=w.previewMessages.findLast(x=>x.startsWith('studio|saveShortCodeSettings|')),data=JSON.parse(decodeURIComponent(msg.split('|')[2]));check(data.RecognitionSymbol==='#'&&!data.ConnectPreviousPoint&&data.AutoClose,'简码符号和独立开关完整提交');check($('previous').getAttribute('aria-checked')==='false','简码开关可被辅助技术识别');w.CDBoxShortCodeSettingsError('磁盘不可写');check(d.querySelector('.toast.error').textContent==='磁盘不可写','简码保存失败可见');w.CDBoxShortCodeSettingsSaved(data);check(d.querySelector('.toast').textContent==='设置已保存','简码保存回执正常');
 w=await load('excel','dark',1060);d=w.document;$=id=>d.getElementById(id);w.CDBoxExcelWorkbookLoaded({filePath:'C:\\示例.xlsx',activeSheetIndex:1,sheets:[{index:1,name:'汇总表',usedRange:'A1:F20',printArea:'A1:D10'}]});d.querySelector('[name=range][value=used]').click();$('textHeight').value='3.25';d.querySelector('[name=output][value=table]').click();$('confirm').click();msg=w.previewMessages.findLast(x=>x.startsWith('studio|confirmExcelToCad|'));data=JSON.parse(decodeURIComponent(msg.split('|')[2]));check(data.sheetName==='汇总表'&&data.rangeMode==='used'&&data.outputType==='table'&&data.textHeight===3.25,'Excel 工作表、范围、输出和高度完整提交');w.CDBoxExcelOperationCompleted(true,'已生成');check(!$('confirm').disabled,'Excel 操作完成恢复按钮');let toggle=d.querySelectorAll('.wb-toggle')[1];toggle.click();toggle.click();check($('textHeight').value==='3.25','Excel 折叠不丢失输入');w.CDBoxExcelSnapshotFallback('未读取到未保存内容');check($('fallback').classList.contains('show'),'Excel 最近保存版本回退提示可见');$('fallbackContinue').click();check(w.previewMessages.some(x=>x.startsWith('studio|confirmSavedExcelFallback|')),'Excel 回退继续使用原路由');w.CDBoxExcelError('读取失败');check(!$('confirm').disabled,'Excel 错误后可重试');
 w=await load('frame','light',1280);d=w.document;$=id=>d.getElementById(id);$('singleView').click();check(!$('templateList').classList.contains('double'),'图框模板单列');$('doubleView').click();check($('templateList').classList.contains('double'),'图框模板双列');let second=d.querySelector('[data-id=b]');second.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));check($('templateName').value==='项目图框（含标题栏）','图框模板支持键盘选择');$('marginTop').value='12.5';$('drawNorth').click();check($('drawNorth').parentElement.nextElementSibling.hidden,'关闭指北针收起详细设置');$('drawNorth').click();check(!$('drawNorth').parentElement.nextElementSibling.hidden,'重新开启指北针恢复详细设置');toggle=d.querySelector('.wb-toggle');toggle.click();check(d.getElementById(toggle.getAttribute('aria-controls')).hidden,'图框设置块可折叠');toggle.click();check($('marginTop').value==='12.5','图框折叠保留输入');$('save').click();msg=w.previewMessages.findLast(x=>x.startsWith('studio|saveFrameSettings|'));data=JSON.parse(decodeURIComponent(msg.split('|')[2]));check(data.templateId==='b'&&data.marginTop===12.5&&data.settings.DrawNorthArrow,'图框模板、留白、绘制设置完整提交');$('makeDefault').click();check(w.previewMessages.includes('studio|setDefaultFrameTemplate|b'),'默认模板操作保留');d.querySelector('[data-action=layout]').click();check(w.previewMessages.includes('studio|runFrameAction|layout'),'CAD 布框操作保留');d.querySelector('[data-paper=A4]').click();check(!!d.querySelector('.fr-empty')&&$('deleteTemplate').disabled,'空图幅有空状态并禁用删除');
 const theme={Theme:'dark',AnimationsEnabled:false,DarkTheme:{Preset:'custom',Background:'#102030',Foreground:'#DDEEFF',Accent:'#3388FF',AccentSource:'custom',Contrast:60,UiFont:'yahei',ContentFont:'mono',UiWeight:400,ContentWeight:500}};w.CDBoxApplyWorkbenchTheme(theme);check(d.body.dataset.theme==='dark'&&w.getComputedStyle(d.body).getPropertyValue('--bg')==='#102030','已打开公共页面即时应用自定义主题');check(w.getComputedStyle($('marginTop')).fontFamily.includes('Consolas'),'公共页面输入使用内容字体');check(d.body.classList.contains('no-animations'),'公共页面遵从动画设置');
 w=await load('home','light',860);d=w.document;for(const tool of ['short-code','frame','excel'])d.querySelector('[data-tool='+tool+']').click();check(w.previewMessages.length===3&&w.previewMessages.every(x=>x.startsWith('studio|openCommonTool|')),'公共业务入口发出三项工具操作');
 document.getElementById('result').textContent=results.length+' 项检查全部通过';await load('frame','light',1280);
}catch(e){document.getElementById('result').textContent='检查失败：'+e.message;results.push(e.stack)}finally{document.getElementById('report').textContent=results.join('\n');this.disabled=false}};
</script></html>
